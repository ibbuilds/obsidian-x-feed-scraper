name: CI
on:
  push:
    branches: [main, feat/local-first-pipeline]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
      - run: npm run build
      - run: npm run sync -- --fixture tests/fixtures/posts.json --db ./data/ci.db
      - run: npm run cli -- status --db ./data/ci.db
