name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install
        run: npm ci --no-audit --no-fund
      - name: Production dependency audit
        run: npm audit --omit=dev --audit-level=high
      - name: Static typecheck
        run: npm run check
      - name: Build standalone Source Scraper CLI and optional Obsidian plugin
        run: npm run package
      - name: All tests including standalone CLI and packaged plugin
        run: npm test
      - name: Real persisted-state CLI smoke across operating systems
        run: npm run smoke
      - name: Verify installable standalone npm tarball
        if: runner.os == 'Linux'
        run: |
          npm pack --pack-destination dist --ignore-scripts --silent
          test -s dist/source-scraper-0.11.0.tgz
          tar -tzf dist/source-scraper-0.11.0.tgz | grep -Fx package/dist/source-scraper.mjs
          if tar -tzf dist/source-scraper-0.11.0.tgz | grep -Eq 'apps/obsidian-plugin|obsidian-x-feed-scraper.zip|node_modules'; then
            echo "CLI package must not include Obsidian or node_modules"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: source-scraper-cli
          path: |
            dist/source-scraper.mjs
            dist/source-scraper-0.11.0.tgz
          if-no-files-found: error
          retention-days: 30
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: optional-obsidian-plugin
          path: dist/obsidian-x-feed-scraper.zip
          if-no-files-found: error
          retention-days: 30

  desktop-obsidian-e2e:
    name: Optional Obsidian Desktop integration (real app)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - run: npm run package
      - name: Install isolated desktop test runner
        run: npm install --prefix tests/desktop --no-audit --no-fund
      - name: Prepare Linux virtual desktop
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y xvfb herbstluftwm
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp &
          sleep 2
          DISPLAY=:99 herbstluftwm &
          sleep 2
      - name: Exercise optional plugin inside actual Obsidian
        env:
          DISPLAY: ':99'
          OBSIDIAN_VERSIONS: latest/latest
          WDIO_MAX_INSTANCES: '1'
        run: ./tests/desktop/node_modules/.bin/wdio run ./tests/desktop/wdio.conf.mts
