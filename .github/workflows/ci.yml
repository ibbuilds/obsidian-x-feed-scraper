name: CI
on:
  push:
    branches: [main, feat/obsidian-first-production]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-test-package:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Install
        run: npm install --no-audit --no-fund
      - name: Static typecheck
        run: npm run check
      - name: Build installable Obsidian plugin ZIP
        run: npm run package
      - name: All tests, including packaged collector
        run: npm test
      - name: Smoke CLI with synthetic fixtures
        run: |
          npm run sync -- --fixture tests/fixtures/posts.json --db ./data/ci.db
          npm run cli -- status --db ./data/ci.db
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: x-feed-scraper-obsidian
          path: dist/obsidian-x-feed-scraper.zip
          if-no-files-found: error
          retention-days: 30
