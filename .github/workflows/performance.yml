name: Performance regression profile
on:
  pull_request:
    paths:
      - "packages/**"
      - "apps/collector/**"
      - "scripts/bench-engine.mjs"
      - "scripts/bench-repeat.mjs"
      - "scripts/bench-reprocess.mjs"
      - "scripts/bench-json-compare.mjs"
      - ".github/workflows/performance.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          path: candidate
      - uses: actions/checkout@v4
        with:
          ref: 939c7c7314db15b709d5c0713571b3a35e82ef37
          path: baseline
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --prefix candidate --no-audit --no-fund
      - run: npm ci --prefix baseline --no-audit --no-fund
      - name: Profile baseline on a clean SQLite database
        run: |
          cp candidate/scripts/bench-engine.mjs candidate/scripts/bench-pagination.mjs candidate/scripts/bench-repeat.mjs candidate/scripts/bench-reprocess.mjs candidate/scripts/bench-json-compare.mjs baseline/scripts/
          cd baseline
          node --experimental-strip-types scripts/bench-engine.mjs 1200 12000 > ../baseline-profile.json
          node --experimental-strip-types scripts/bench-pagination.mjs 6000 50 > ../baseline-pagination.json
          node --experimental-strip-types scripts/bench-repeat.mjs 1800 > ../baseline-repeat.json
          node --experimental-strip-types scripts/bench-reprocess.mjs 2400 > ../baseline-reprocess.json
          node --experimental-strip-types scripts/bench-json-compare.mjs 16000 > ../baseline-json-compare.json
      - name: Profile candidate with identical synthetic data
        run: |
          cd candidate
          node --experimental-strip-types scripts/bench-engine.mjs 1200 12000 > ../candidate-profile.json
          node --experimental-strip-types scripts/bench-pagination.mjs 6000 50 > ../candidate-pagination.json
          node --experimental-strip-types scripts/bench-repeat.mjs 1800 > ../candidate-repeat.json
          node --experimental-strip-types scripts/bench-reprocess.mjs 2400 > ../candidate-reprocess.json
          node --experimental-strip-types scripts/bench-json-compare.mjs 16000 > ../candidate-json-compare.json
      - name: Compare critical hot paths without source or network dependencies
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync} from 'node:fs';
          const a=JSON.parse(readFileSync('baseline-profile.json','utf8'));
          const b=JSON.parse(readFileSync('candidate-profile.json','utf8'));
          for(const name of Object.keys(a.phases)){
            const old=a.phases[name],now=b.phases[name];
            console.log(name+': baseline '+old+' ms, candidate '+now+
              ' ms; ratio '+(now/Math.max(old,0.01)).toFixed(3));
          }
          console.log('Review query plan before:',a.plan.join(' | '));
          console.log('Review query plan after:',b.plan.join(' | '));
          if(!b.plan.some(line=>line.includes('kb_reviews_lookup'))){
            throw new Error('Review lookup did not use the new per-entity index');
          }
          for(const key of ['listEntitiesMs','getEvidenceMs']){
            if(b.phases[key]>a.phases[key]*2){
              throw new Error('Large regression in indexed hot path: '+key);
            }
          }
          const oldPages=JSON.parse(readFileSync('baseline-pagination.json','utf8'));
          const newPages=JSON.parse(readFileSync('candidate-pagination.json','utf8'));
          for(const key of ['jsonFileMs','jsonSnapshotMs']){
            const before=oldPages.phases[key],after=newPages.phases[key];
            console.log(key+': baseline '+before+' ms, candidate '+after+
              ' ms; ratio '+(after/Math.max(before,0.01)).toFixed(3));
            if(after>before*2)throw new Error('Large pagination regression: '+key);
          }
          const oldRepeat=JSON.parse(readFileSync('baseline-repeat.json','utf8'));
          const newRepeat=JSON.parse(readFileSync('candidate-repeat.json','utf8'));
          for(const key of ['initialMs','unchangedMs','changedMs']){
            const before=oldRepeat.phases[key],after=newRepeat.phases[key];
            console.log(key+': baseline '+before+' ms, candidate '+after+
              ' ms; ratio '+(after/Math.max(before,0.01)).toFixed(3));
          }
          if(newRepeat.phases.unchangedMs>oldRepeat.phases.unchangedMs*1.5){
            throw new Error('Unchanged replay regressed more than 50%');
          }
          if(newRepeat.phases.initialMs>oldRepeat.phases.initialMs*1.4){
            throw new Error('Initial ingestion regressed more than 40%');
          }
          const oldReprocess=JSON.parse(readFileSync('baseline-reprocess.json','utf8'));
          const newReprocess=JSON.parse(readFileSync('candidate-reprocess.json','utf8'));
          for(const key of ['reprocessMs','repeatMs']){
            const before=oldReprocess.phases[key],after=newReprocess.phases[key];
            console.log('offline '+key+': baseline '+before+' ms, candidate '+after+
              ' ms; ratio '+(after/Math.max(before,0.01)).toFixed(3));
            if(after>before*1.5){
              throw new Error('Offline reassessment regressed more than 50%: '+key);
            }
          }
          const oldJson=JSON.parse(readFileSync('baseline-json-compare.json','utf8'));
          const newJson=JSON.parse(readFileSync('candidate-json-compare.json','utf8'));
          if(oldJson.changePath!==newJson.changePath){
            throw new Error('JSON diff path changed');
          }
          for(const name of ['equal','different','diff']){
            const before=oldJson.phases[name],after=newJson.phases[name];
            const ratio=after/Math.max(before,0.01);
            console.log('deep JSON '+name+': baseline '+before+' ms, candidate '+after+
              ' ms; ratio '+ratio.toFixed(3));
            if(ratio>=0.65)throw new Error('Insufficient JSON comparison speedup: '+name);
          }
          NODE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: offline-performance-profile
          path: |
            baseline-profile.json
            candidate-profile.json
            baseline-pagination.json
            candidate-pagination.json
            baseline-repeat.json
            candidate-repeat.json
            baseline-reprocess.json
            candidate-reprocess.json
            baseline-json-compare.json
            candidate-json-compare.json
          retention-days: 30
