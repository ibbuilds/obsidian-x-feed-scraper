name: Obsidian plugin preview release
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: discovery-preview-release
  cancel-in-progress: false
jobs:
  publish-preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run package
      - run: npm test
      - name: Derive release identity from the tested checkout
        id: release
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync,appendFileSync} from 'node:fs';
          const version=JSON.parse(readFileSync('package.json','utf8')).version;
          const plugin=JSON.parse(readFileSync('apps/obsidian-plugin/manifest.json','utf8'));
          if(!/^\d+\.\d+\.\d+$/.test(version)||plugin.version!==version) {
            throw new Error('Release and plugin versions must agree');
          }
          appendFileSync(process.env.GITHUB_OUTPUT,`tag=v${version}-beta.1\nversion=${version}\n`);
          NODE
      - name: Publish tested Obsidian plugin preview
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preview release already exists; preserving its published asset."
          else
            gh release create "$TAG" dist/obsidian-x-feed-scraper.zip \
              --title "Discovery Engine for Obsidian v${VERSION} Beta1" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --prerelease \
              --notes-file "docs/releases/${VERSION}.md"
          fi
