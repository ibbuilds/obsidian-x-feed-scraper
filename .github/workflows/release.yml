name: Obsidian plugin preview release
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: write
jobs:
  publish-preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - run: npm run check
      - run: npm run package
      - run: npm test
      - name: Publish tested Obsidian plugin preview
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v0.3.0-beta.1
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preview release already exists; preserving its published asset."
          else
            gh release create "$TAG" dist/obsidian-x-feed-scraper.zip \
              --title "X Feed Scraper for Obsidian v0.3.0 Preview" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --prerelease \
              --notes "Obsidian desktop plugin with bundled local collector, RSS and manual imports, SQLite, source review and Bases. Not production verified in a user's vault. Personalized X For You access is not available."
          fi
