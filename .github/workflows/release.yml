name: Source Scraper CLI and optional Obsidian preview release
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
permissions:
  contents: write
concurrency:
  group: source-scraper-preview-release
  cancel-in-progress: false
jobs:
  publish-preview:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_branch == 'main' && github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - run: npm ci --no-audit --no-fund
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run check
      - run: npm run package
      - run: npm test
      - name: Pack CLI for offline npm install
        run: npm pack --pack-destination dist --ignore-scripts --silent
      - name: Verify artifacts and release identity on tested commit
        id: release
        run: |
          node --input-type=module - <<'NODE'
          import {readFileSync,existsSync,appendFileSync} from 'node:fs';
          const pkg=JSON.parse(readFileSync('package.json','utf8'));
          const plugin=JSON.parse(readFileSync('apps/obsidian-plugin/manifest.json','utf8'));
          if(!/^\d+\.\d+\.\d+$/.test(pkg.version)||plugin.version!==pkg.version) {
            throw new Error('Core and optional integration release versions must agree');
          }
          for(const path of [
            'dist/source-scraper.mjs',
            'dist/source-scraper-'+pkg.version+'.tgz',
            'dist/obsidian-x-feed-scraper.zip'
          ])if(!existsSync(path))throw new Error('Missing release artifact '+path);
          appendFileSync(process.env.GITHUB_OUTPUT,'tag=v'+pkg.version+'-beta.1\nversion='+pkg.version+'\n');
          NODE
          sha256sum dist/source-scraper.mjs dist/source-scraper-*.tgz dist/obsidian-x-feed-scraper.zip
      # Explicit project policy: keep only the newly tested GitHub Release.
      # Keep Git tags and commits for source history and reproducibility.
      - name: Delete all older GitHub Releases before publishing this version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          set -euo pipefail
          mapfile -t releases < <(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          for old in "${releases[@]}"; do
            if [[ "$old" == "$TAG" ]]; then continue; fi
            echo "Deleting superseded GitHub Release $old (preserving its Git tag)"
            gh release delete "$old" --yes
          done
          mapfile -t remaining < <(gh release list --limit 1000 --json tagName --jq '.[].tagName')
          for old in "${remaining[@]}"; do
            if [[ "$old" != "$TAG" ]]; then
              echo "ERROR: superseded release still published: $old"
              exit 1
            fi
          done
      - name: Publish tested Source Scraper CLI and optional Obsidian integration
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.release.outputs.tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Preview release already exists; preserving its published assets."
          else
            gh release create "$TAG" \
              dist/source-scraper.mjs \
              "dist/source-scraper-${VERSION}.tgz" \
              dist/obsidian-x-feed-scraper.zip \
              --title "Source Scraper v${VERSION} Beta1 — JSON CLI + optional Obsidian" \
              --target "${{ github.event.workflow_run.head_sha }}" \
              --prerelease \
              --notes-file "docs/releases/${VERSION}.md"
          fi
